[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --datadir=/var/lib/mysql --pid-file=/run/mysqld/mysqld.pid --socket=/run/mysqld/mysqld.sock
autostart=true
autorestart=true
priority=1
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/mariadb.log
redirect_stderr=true

[program:haproxy]
command=/bin/sh -c 'envsubst < /etc/haproxy/haproxy.cfg.template > /etc/haproxy/haproxy.cfg && exec haproxy -db -f /etc/haproxy/haproxy.cfg'
autostart=true
autorestart=true
priority=2
environment=SERVER_HOSTNAME="127.0.0.1",SERVER_PORT="8002"
stdout_logfile=/var/log/supervisor/haproxy.log
redirect_stderr=true

[program:mitmproxy]
command=/opt/venv/bin/mitmdump --mode reverse:http://127.0.0.1:80 -p 8002 --set block_global=false --set keep_host_header=true --no-http2
autostart=true
autorestart=true
priority=3
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/mitmproxy.log
redirect_stderr=true

[program:apache2]
command=/usr/local/bin/start-apache.sh
autostart=true
autorestart=true
priority=4
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/apache2.log
redirect_stderr=true
